[package]
name = "chanh-phap"
version = "1.0.0"
description = "Đại Thư Viện Kinh Điển Phật Giáo Chánh Pháp — Windows Desktop Engine"
authors = ["Thư Viện Chánh Pháp"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chanh_phap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ort = "=2.0.0-rc.9"
ort-sys = "=2.0.0-rc.9"
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1.11"
unicode-normalization = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

