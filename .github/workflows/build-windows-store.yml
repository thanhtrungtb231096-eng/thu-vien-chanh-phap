name: Build Chánh Pháp Windows PC App (Microsoft Store .msix & Setup .exe)

on:
  workflow_dispatch:
    inputs:
      remote_server_url:
        description: "Địa chỉ máy chủ Thư viện / CDN chứa gói Kinh & AI TTS"
        required: false
        default: "https://thuvienchanhphap.duckdns.org"
      ms_store_identity_name:
        description: "Package/Identity/Name từ Microsoft Partner Center (khi nộp Store)"
        required: false
        default: "ChanhPhap.DaiThuVienKinhDien"
      ms_store_publisher:
        description: "Package/Identity/Publisher từ Microsoft Partner Center (VD: CN=XXXXXXXX-XXXX-...)"
        required: false
        default: "CN=ChanhPhap"
      app_version:
        description: "Phiên bản 4 số chuẩn MSIX (VD: 1.0.0.0)"
        required: false
        default: "1.0.0.0"
  push:
    tags:
      - "v[0-9]*"
      - "windows-v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Store (.msix) & Standalone Installer (.exe)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11 & Pillow (Tạo bộ Icon .ico & Tiles Microsoft Store)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện xử lý ảnh Pillow
        shell: pwsh
        run: python -m pip install --upgrade pip pillow

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài đặt trình biên dịch Rust Stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Bộ nhớ đệm Rust Cargo (Tăng tốc biên dịch lần sau)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-windows/src-tauri -> target"

      - name: Đóng gói Gói Kinh Cốt Lõi & Windows Staging (Web Shell + Icons + AppxManifest)
        shell: pwsh
        env:
          REMOTE_BASE: ${{ inputs.remote_server_url || 'https://thuvienchanhphap.duckdns.org' }}
          MS_IDENTITY: ${{ inputs.ms_store_identity_name || secrets.MS_STORE_IDENTITY_NAME || 'ChanhPhap.DaiThuVienKinhDien' }}
          MS_PUBLISHER: ${{ inputs.ms_store_publisher || secrets.MS_STORE_PUBLISHER || 'CN=ChanhPhap' }}
          MS_VERSION: ${{ inputs.app_version || '' }}
        run: |
          $semver = "1.1.0"
          if ($env:GITHUB_REF_NAME -match '(\d+\.\d+\.\d+)') {
            $semver = $Matches[1]
          }
          $msVer = if ($env:MS_VERSION) { $env:MS_VERSION } else { "$semver.0" }

          $packsTmp = Join-Path $env:RUNNER_TEMP "windows-packs"
          $stagingDir = "desktop-windows/staging"
          New-Item -ItemType Directory -Force -Path $packsTmp | Out-Null

          $coreDb = Join-Path $packsTmp "core-bundled.pack.db"
          if (Test-Path "local/storage/state/search.sqlite3") {
            python -X utf8 tools/mobile/build_text_packs.py --only core-bundled --out "$packsTmp" --allow-in-repo
          }
          if ((-not (Test-Path $coreDb)) -or ((Get-Item $coreDb).Length -lt 1000000)) {
            Write-Host "Đang tải core-bundled.pack.db từ máy chủ $($env:REMOTE_BASE)..."
            Invoke-WebRequest -Uri "$($env:REMOTE_BASE)/mobile-packs/text-packs/core-bundled.pack.db" -OutFile $coreDb
          }
          if ((Get-Item $coreDb).Length -lt 1000000) {
            throw "Tệp core-bundled.pack.db không hợp lệ hoặc chưa được tải lên máy chủ CDN!"
          }

          python -X utf8 tools/windows/build_windows_shell.py `
            --out "$stagingDir" `
            --core-pack "$coreDb" `
            --identity-name "$env:MS_IDENTITY" `
            --publisher "$env:MS_PUBLISHER" `
            --version "$msVer" `
            --allow-in-repo

          $confPath = (Resolve-Path "desktop-windows/src-tauri/tauri.conf.json").Path
          $cfg = [IO.File]::ReadAllText($confPath, [Text.Encoding]::UTF8) | ConvertFrom-Json
          $cfg.version = $semver
          $cfg.build.frontendDist = "../staging/www"
          $cfg.bundle.icon = @(
            "../staging/icons/32x32.png",
            "../staging/icons/128x128.png",
            "../staging/icons/128x128@2x.png",
            "../staging/icons/icon.ico"
          )
          $jsonOut = ($cfg | ConvertTo-Json -Depth 10) + "`n"
          [IO.File]::WriteAllText($confPath, $jsonOut, [Text.UTF8Encoding]::new($false))

      - name: Biên dịch Tauri v2 Native Rust & Bộ cài đặt độc lập (NSIS .exe)
        working-directory: desktop-windows
        shell: pwsh
        run: |
          npm install --no-audit --no-fund

          $logFile = Join-Path $env:RUNNER_TEMP "tauri-build.log"
          cmd /c "npx tauri build --bundles nsis > `"$logFile`" 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content -Path $logFile -Tail 120
          if ($exitCode -ne 0) {
            $errLines = Select-String -Path $logFile -Pattern "error\[|error:|panicked|failed" | Select-Object -Last 25
            foreach ($m in $errLines) {
              Write-Host "::error::$($m.Line)"
            }
            $tailLines = Get-Content -Path $logFile -Tail 15
            foreach ($l in $tailLines) {
              if ($l.Trim()) { Write-Host "::error::$l" }
            }
            exit $exitCode
          }

          $nsisExe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsisExe) {
            throw "Không tìm thấy bộ cài NSIS *-setup.exe sau khi biên dịch!"
          }
          Copy-Item $nsisExe.FullName (Join-Path $env:RUNNER_TEMP "ChanhPhap-Windows-Setup_x64.exe") -Force

      - name: Đóng gói Gói chuẩn Microsoft Store (ChanhPhap-Windows-Store_x64.msix) bằng Windows SDK
        shell: pwsh
        run: |
          $stagingDir = "desktop-windows/staging"
          $msixLayout = Join-Path $env:RUNNER_TEMP "msix-layout"
          $releaseDir = "desktop-windows/src-tauri/target/release"

          New-Item -ItemType Directory -Force -Path $msixLayout | Out-Null
          Copy-Item -Path "$stagingDir/msix-template/*" -Destination $msixLayout -Recurse -Force
          Copy-Item -Path "$releaseDir/chanh-phap.exe" -Destination "$msixLayout/chanh-phap.exe" -Force

          # Sao chép mọi thư viện động đi kèm (nếu có, ví dụ onnxruntime.dll / WebView2Loader.dll)
          Get-ChildItem -Path $releaseDir -Filter "*.dll" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path $msixLayout $_.Name) -Force
          }

          # Nhúng trực tiếp gói Kinh Cốt Lõi để trích xuất siêu tốc ngay lần mở đầu tiên
          $packsDest = Join-Path $msixLayout "packs"
          New-Item -ItemType Directory -Force -Path $packsDest | Out-Null
          $coreDb = Join-Path $stagingDir "www/packs/core-bundled.pack.db"
          if (Test-Path $coreDb) {
            Copy-Item $coreDb -Destination (Join-Path $packsDest "core-bundled.pack.db") -Force
          }

          $makeappx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) {
            throw "Không tìm thấy makeappx.exe trong Windows Kits 10!"
          }

          $msixOut = Join-Path $env:RUNNER_TEMP "ChanhPhap-Windows-Store_x64.msix"
          & "$makeappx" pack /d "$msixLayout" /p "$msixOut" /o
          if ($LASTEXITCODE -ne 0) {
            throw "Đóng gói MSIX bằng makeappx.exe thất bại (mã lỗi $LASTEXITCODE)."
          }

      - name: Ký số Code Signing bằng chứng chỉ PFX (Tùy chọn khi cài MSIX nội bộ ngoài Store)
        if: ${{ env.WINDOWS_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          foreach ($target in @(
            (Join-Path $env:RUNNER_TEMP "ChanhPhap-Windows-Setup_x64.exe"),
            (Join-Path $env:RUNNER_TEMP "ChanhPhap-Windows-Store_x64.msix")
          )) {
            & "$signtool" sign /fd SHA256 /f "$pfxPath" /p "$env:WINDOWS_PFX_PASSWORD" /tr "http://timestamp.digicert.com" /td SHA256 "$target"
          }

      - name: Tải lên Bộ cài đặt Windows Độc lập (ChanhPhap-Windows-Setup_x64.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ChanhPhap-Windows-Setup-EXE
          path: ${{ runner.temp }}/ChanhPhap-Windows-Setup_x64.exe
          retention-days: 30

      - name: Tải lên Gói chuẩn Microsoft Store (ChanhPhap-Windows-Store_x64.msix)
        uses: actions/upload-artifact@v4
        with:
          name: ChanhPhap-Windows-Store-MSIX
          path: ${{ runner.temp }}/ChanhPhap-Windows-Store_x64.msix
          retention-days: 30

      - name: Xuất bản công khai Bộ cài đặt Windows (.exe & .msix) lên GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $exeFile = Join-Path $env:RUNNER_TEMP "ChanhPhap-Windows-Setup_x64.exe"
          $msixFile = Join-Path $env:RUNNER_TEMP "ChanhPhap-Windows-Store_x64.msix"
          $notes = @"
          ### Đại Thư Viện Chánh Pháp — Bộ cài đặt chính thức miễn phí

          - **Điện thoại Android**: Tải trực tiếp **`ChanhPhap-Android.apk`** bên dưới để cài đặt (hỗ trợ nghe kinh tắt màn hình, kho 5.348 bản kinh & giọng đọc AI ngoại tuyến).
          - **Máy tính Windows 10/11**: Tải trực tiếp **`ChanhPhap-Windows-Setup_x64.exe`** để cài đặt trong 10 giây.
          - **iPhone / iPad**: Mở `https://thuvienchanhphap.duckdns.org` bằng Safari → **Chia sẻ** → **Thêm vào Màn hình chính** (10 giây, không bao giờ hết hạn), hoặc cài gói Native **`ChanhPhap-iOS-Unsigned.ipa`** qua Sideloadly / SideStore.
          "@

          $relTag = $env:TAG_NAME -replace '^windows-', ''
          gh release view "$relTag" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$relTag" --title "Đại Thư Viện Chánh Pháp $relTag" --notes "$notes"
          }
          for ($i = 1; $i -le 4; $i++) {
            gh release upload "$relTag" "$exeFile" "$msixFile" --clobber
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 3
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Không thể tải tệp cài đặt Windows lên GitHub Release $relTag."
          }
